[project]
authors = [{name = "Tyler Hellstern", email = "tjh71@duke.edu"}]
description = "Library for Parnassus for Clas12, a fast simulation trained for the CLAS12 detector at JLab."
license = { text = "MIT" }
readme = "README.md"
name = "parnassus-clas12"
requires-python = ">= 3.11"
version = "0.1.0"
dependencies = [
    "awkward",
    "h5py",
    "numpy",
    "uproot",
    "torch<=2.9.1",
    "torchvision",
    "tqdm",
    "matplotlib",
    "scipy",
    "scikit-learn",
    "fastjet",
    "comet_ml",
    "lightning==2.6.1",
    "seaborn",
    "networkx",
    "hdf5plugin",
    "lion-pytorch",
    "onnx",
    "onnxruntime",
    "jsonargparse[signatures]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
]