name: rcfm_cms_pow_fevt_MSEDir_Deep5M_Flash_SinCos
model_type: particle_network
flow_type: rcfm
sigma: 0
loss_type: mse_and_direction
sampler_type: dpm
n_steps: 10

num_epochs: 500

opt: lion
optimizer_kwargs:
    weight_decay: 0.01
    lr: 3e-5

lr_scheduler: true
lr_scheduler_dict:
    gamma: 0.5

use_swa: true
use_ema: false
ema_decay: 0.999
check_val_every_n_epoch: 1
gradient_clip_val: 1.0

data:
  num_workers: 6

  train_batch_size: 128
  valid_batch_size: 1000

  max_particles: 400
  zero_neutral_vtx: true
  sin_cos: true

  num_train: 2_800_000
  num_valid: 35000

  entry_start_train: 0
  entry_start_valid: 2_800_000
  entry_start_test: 0

  train_path: /storage/agrp/dmitrykl/fastsim/f_delphes/data/full_event/output/QCD_Pt-470to600_TTbar_Merged/merged_train_v2_pt025_eta27_ghost.root
  valid_path: /storage/agrp/dmitrykl/fastsim/f_delphes/data/full_event/output/QCD_Pt-470to600_TTbar_Merged/merged_train_v2_pt025_eta27_ghost.root
  test_path: /storage/agrp/dmitrykl/fastsim/f_delphes/data/full_event/output/QCD_Pt-600to800_TuneZ2_7TeV_pythia6/merged_test_small_v2_pt025_eta27_ghost.root

  scale_dict_path: /srv01/agrp/dmitrykl/projects/parnassus-dev/experiments/cms_2011/configs/var_transform.yaml

  variables: !include particle_vars.yaml


model:
    time_embedding:
        hidden_dim: &dim 96
        time_factor: 1000
    
    fs_init_net:
        input_dim: 12
        hidden_dim: [*dim, *dim]
        output_dim: *dim
        act_h: SiLU

    ctxt_networks:
        - input_name: ctxt
          fields: ['data']
          dense_kwargs:
            input_dim: 12
            hidden_dim: [*dim, *dim]
            output_dim: *dim
            act_h: SiLU
        - input_name: ctxt_global
          fields: ['data']
          dense_kwargs:
            input_dim: 8
            hidden_dim: [*dim, *dim]
            output_dim: *dim
            act_h: SiLU
    
    global_embedding:
        input_names: ['ctxt', 'ctxt_global', 'time']

    encoder:
        hidden_dim: *dim
        num_heads: 6
        num_layers: 8
        attn_type: flash-varlen
        mha_config:
            qk_norm: true
            bias: false

    fs_out_net:
        input_dim: *dim
        hidden_dim: [*dim, *dim]
        output_dim: 12
        act_h: SiLU 
        ctxt_dim: 288