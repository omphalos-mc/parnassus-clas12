name: v8_1_clas12_RGA_particle

trainer:
  num_nodes: 10
  devices: 4
  max_epochs: 110
  callbacks:
    - class_path: parnassus_core.flow.callbacks.EMAModelCheckpoint
      init_args:
        monitor: val/loss
        save_last: true
    - class_path: parnassus_core.flow.callbacks.EMA
      init_args:
        decay: 0.9999
        pct_start: 0.667
        validate_original_weights: true
    - class_path: parnassus_core.flow.callbacks.SigtermCheckpoint
    - class_path: parnassus_core.flow.callbacks.ParticlePerformanceLogger
      init_args:
        skip_jet_logs: true
        skip_met_logs: true
    - class_path: lightning.pytorch.callbacks.ModelSummary
      init_args:
        max_depth: 2
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 100
    - class_path: lightning.pytorch.callbacks.StochasticWeightAveraging
      init_args:
        swa_lrs: 1e-6
    - class_path: parnassus_core.flow.callbacks.SWACheckpoint

data:
  train_type: particle

  train_path: /global/cfs/cdirs/m3246/tjhellst/parnassus_data/v8/v8_train.root
  valid_path: /global/cfs/cdirs/m3246/tjhellst/parnassus_data/v8/v8_train.root
  num_train: 40_000_000
  num_valid: 500_000
  train_batch_size: 800
  entry_start_valid: 40_000_000

  scale_dict: src/parnassus_core/experiments/clas12_RGA/configs/v8/var_transform_v8.yaml
  var_dict: src/parnassus_core/experiments/clas12_RGA/configs/v8/particle_vars_v8.yaml
  class_based_scaling: true

model:
  optimizer: Lion
  optimizer_kwargs:
    lr: 3e-5
    weight_decay: 0.01
  lrs_config:
    skip_scheduler: false
    lr_scheduler_type: cosine
    lr_scheduler_kwargs:
      first_cycle_steps: 110
      gamma: 0.85
      min_lr: 1e-6

  loss:
    class_path: parnassus_core.flow.utils.MSEAndDirectionLoss

  fm:
    class_path: parnassus_core.flow.utils.FlowMatcher
    init_args:
      flow_type: rcfm
      time_distribution: pow
      power_alpha: 0.5

  sampler_type: dpm
  n_steps: 10

  model:
    class_path: parnassus_core.flow.models.ParticleNetwork
    init_args:
      time_embedding:
        class_path: parnassus_core.flow.modules.TimestepEmbedder
        init_args:
          hidden_dim: &dim 128
          time_factor: 1000
      fs_init_net:
        class_path: parnassus_core.flow.modules.DenseNetwork
        init_args:
          input_dim: 20
          hidden_dim: [*dim, *dim]
          output_dim: *dim
          act_h: &act SiLU
      ctxt_networks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: parnassus_core.flow.modules.NamedNetwork
              init_args:
                input_name: ctxt
                fields: ["data"]
                dense_kwargs:
                  input_dim: 20
                  hidden_dim: [*dim, *dim]
                  output_dim: *dim
                  act_h: *act
            - class_path: parnassus_core.flow.modules.NamedNetwork
              init_args:
                input_name: ctxt_global
                fields: ["data"]
                dense_kwargs:
                  input_dim: 19
                  hidden_dim: [*dim, *dim]
                  output_dim: *dim
                  act_h: *act
      global_embedding:
        class_path: parnassus_core.flow.modules.GlobalContextEmbedding
        init_args:
          input_names: ["ctxt", "ctxt_global", "time"]
      encoder:
        class_path: parnassus_core.flow.modules.DiTEncoder
        init_args:
          hidden_dim: *dim
          num_heads: 8
          num_layers: 8
          attn_type: flex
          bidirectional: true
          do_selfattn: false
          simplify: false
          mha_config:
            qk_norm: true
            bias: false
      fs_out_net:
        class_path: parnassus_core.flow.modules.DenseNetwork
        init_args:
          input_dim: *dim
          hidden_dim: [*dim, *dim, *dim]
          output_dim: 20
          act_h: *act
          ctxt_dim: 384
