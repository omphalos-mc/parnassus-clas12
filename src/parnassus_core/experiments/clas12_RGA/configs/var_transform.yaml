# Per-pdgId particle transforms (data.class_based_scaling). Each particle uses the
# block of its pdgId bucketed like the pdgId one-hot (utils/pid.py
# pid_onehot_ids); species without a bucket use pdgId_0 (truth K0L, anti-neutrons
# and mu+-: 0.9% of truth particles, none in pflow). The samples have no
# deuterons, so there is no pdgId_45 block. In this mode a per-particle variable missing
# from the particle's block is passed through unscaled, so every block lists
# every scaled per-particle variable.
# p and theta: per-pdgId stats, truth and pflow combined. beta, vx, vy and vz
# alias the global entries.
