# Feature scaling for the CLAS12 models (scale_dict of configs/event.yaml,
# configs/particle.yaml and evaluation/configs/config.yaml).
#
# Provenance: the statistics were computed on the training sample with
# preprocessing/scaling/calculate_transforms_batched.py (--split-class for the
# per-pdgId blocks below), and the file was then edited by hand:
#   - entries the models do not use are removed (the pt-based variables pt, prel,
#     ptrel, ht, met_x and met_y; the models train on p and the p-based event sums),
#   - the pdgId_45 (deuteron) block is dropped, since the samples have no deuterons,
#   - the explanatory comments were added.
# The exact scaling command and config of that run were not recorded. The values
# below are the ones the paper models were trained and evaluated with; changing
# them invalidates the released checkpoints.
#
