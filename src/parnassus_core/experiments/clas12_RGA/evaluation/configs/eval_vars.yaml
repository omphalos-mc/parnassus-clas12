# Variables for the full-chain evaluation (evaluation/configs/config.yaml).
#
# fs_vars.event must match the targets of configs/event_vars.yaml, and
# fs_vars.particle and ctxt_vars must match configs/particle_vars.yaml, exactly
# and in order: EvaluationModel._get_fs_var_idxs walks these lists to compute
# feature offsets into the generated tensor, so a reordering mis-slices silently
# rather than raising.
#
# Only the truth collection is loaded here: in eval mode
# PhysicsDatasetBase._apply_eval_filter keeps only the collections referenced by
# ctxt_vars, so every pflow variable comes from the models, not from data. These
# truth branches are exactly what a LUND input provides.
event_vars: ["eventNumber"]
vars_to_load:
  truth:
    - p
    - theta
    - phi
    - beta
    - vx
    - vy
    - vz
    - pdgId

fs_vars:
  event:
    - npflow
    - pflow_ht_p
    - pflow_Pxh
    - pflow_Pyh
    - pflow_Ng
    - pflow_Nn

  particle:
    - pflow_p
    - pflow_theta
    - pflow_phi
    - pflow_beta
    - pflow_vx
    - pflow_vy
    - pflow_vz
    - pflow_pdgId

ctxt_vars:
  - truth_p
  - truth_theta
  - truth_phi
  - truth_beta
  - truth_vx
  - truth_vy
  - truth_vz
  - truth_pdgId

ctxt_global_vars:
  - means
  - ntruth
  - truth_ht_p
  - truth_Pxh
  - truth_Pyh
  - truth_Ng
  - truth_Nn
