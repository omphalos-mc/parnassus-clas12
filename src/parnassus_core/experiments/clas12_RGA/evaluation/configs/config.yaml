# Full-chain evaluation (event model -> particle model) of the CLAS12 test sample.
# The scatE classifier supplies the scattered-electron reconstruction efficiency:
# the scatE_filter block below keeps each event of v8_test.root with the
# classifier's probability while the dataset is read, and n_events counts the
# kept (evaluated) events. For the paper run:
#
#   python -m parnassus_core.evaluation.eval \
#       -c src/parnassus_core/experiments/clas12_RGA/evaluation/configs/config.yaml
#
# The full-sim reference for postprocess_eval's -d (postprocess_union.yaml) keeps
# the events with pflow_scatE == 1:
#
#   python -m parnassus_core.experiments.clas12_RGA.evaluation.scatE_filter \
#       -i <parnassus_data>/v8/v8_test.root \
#       -o <parnassus_data>/v8/v8_test_filtered_truth.root
#
# See the evaluation section of the experiment README.

eval_path: clasdis_filtered
recalculate_ip: False
trim_padding: true
torch_compile: true

scale_dict: src/parnassus_core/experiments/clas12_RGA/configs/var_transform.yaml
var_dict: src/parnassus_core/experiments/clas12_RGA/evaluation/configs/eval_vars.yaml

event_model:
  ckpt_path: src/parnassus_core/experiments/clas12_RGA/pre-trained-models/event_model.ckpt
  sampler_type: "pndm"
  n_steps: 25

particle_model:
  ckpt_path: src/parnassus_core/experiments/clas12_RGA/pre-trained-models/particle_model.ckpt
  sampler_type: "dpm"
  n_steps: 40

scatE_filter:
  ckpt_path: src/parnassus_core/experiments/clas12_RGA/pre-trained-models/pre-filter_model.ckpt
  mode: sample
  seed: 0

data:
  top_folder: /path/to/root_files
  max_particles: 53
  eta_clamp: [-3.0, 5.0]
  class_based_scaling: true
  datasets:
    - name: clasdis_filtered
      path: v8/v8_test.root
      n_events: 500_000
