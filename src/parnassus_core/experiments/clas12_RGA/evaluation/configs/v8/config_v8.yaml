# Full-chain v8 evaluation (event model -> particle model) on a classifier-filtered
# CLAS12 sample. Same input, scalers and var_dict as config_v8_1.yaml, which
# describes how the filtered sample is made; only the checkpoints and the
# inference options differ (v8 runs without trim_padding / torch_compile).

eval_path: clasdis_v8_filtered

# clas12 models raw vz (not vz_shifted); recalculate_ip=True forwards pv_coords
# so the unscaler's default unshift path has the tensor it dereferences.
recalculate_ip: True

scale_dict: src/parnassus_core/experiments/clas12_RGA/configs/v8/var_transform_v8.yaml
var_dict: src/parnassus_core/experiments/clas12_RGA/evaluation/configs/v8/eval_vars_v8.yaml

event_model:
  ckpt_path: /global/homes/t/tjhellst/link_to_work/parnassus-core/logs/v8_clas12_RGA_event_20261027-T194204/ckpts/epoch=093-step=195896-val_loss=0.67025.ckpt
  # Same sampler as training and the per-epoch eventNetTest runs.
  sampler_type: "pndm"
  n_steps: 25

particle_model:
  ckpt_path: /global/homes/t/tjhellst/link_to_work/parnassus-core/logs/v8_clas12_RGA_particle_20261027-T194201/ckpts/epoch=091-step=191728-val_loss=0.31124.ckpt
  sampler_type: "dpm"
  n_steps: 40


data:
  top_folder: /global/cfs/cdirs/m3246/tjhellst/parnassus_data
  # Match training (configs/base.yaml). The eval default is 400, but AllEvents
  # carries a high-multiplicity tail that AllScatE never had, and both the
  # dataset-level `ntruth < max_particles` cut and generate_event's
  # `fs_npart < max_particles` veto key off this value -- so pin it to the
  # trained regime rather than inheriting the CMS-era default.
  max_particles: 53
  # Must match training (configs/base.yaml): CLAS12 forward tracks reach eta > 4,
  # and the scaler stats were fit on data clamped this way.
  eta_clamp: [-3.0, 5.0]
  # Must match training (event_v8.yaml / particle_v8.yaml): p and theta use the
  # per-pdgId blocks of var_transform_v8.yaml, both for the truth conditioning and
  # for unscaling the generated particles.
  class_based_scaling: true
  datasets:
    - name: clasdis_v8_filtered
      path: v8/v8_test_filtered.root
      n_events: 500_000
