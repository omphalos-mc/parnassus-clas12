# Full-chain evaluation (event model -> particle model) of generator output in
# LUND format, e.g. clasdis .dat files from the CLAS12 Monte Carlo workflow.
#
# A LUND dataset path may be one .dat/.lund file, a directory of them, or a glob;
# files are read in name order and eventNumber counts the events of the
# concatenated input from 0. The truth particles are built as for the training
# samples (final-state particles, no electron neutrinos, theta >= 1 degree), and
# the scatE_filter block keeps each event with the classifier's probability of a
# reconstructed scattered electron; n_events counts the kept (evaluated) events.
# Point data.top_folder at the directory holding the LUND files, then run
#
#   python -m parnassus_core.evaluation.eval \
#       -c src/parnassus_core/experiments/clas12_RGA/evaluation/configs/config_lund.yaml
#
# There is no full-simulation reference for generator-only input, so the output is
# not postprocessed against one.

eval_path: clasdis_lund
recalculate_ip: False
trim_padding: true
torch_compile: true

scale_dict: src/parnassus_core/experiments/clas12_RGA/configs/var_transform.yaml
var_dict: src/parnassus_core/experiments/clas12_RGA/evaluation/configs/eval_vars.yaml

event_model:
  ckpt_path: src/parnassus_core/experiments/clas12_RGA/pre-trained-models/event_model.ckpt
  sampler_type: "pndm"
  n_steps: 25

particle_model:
  ckpt_path: src/parnassus_core/experiments/clas12_RGA/pre-trained-models/particle_model.ckpt
  sampler_type: "dpm"
  n_steps: 40

scatE_filter:
  ckpt_path: src/parnassus_core/experiments/clas12_RGA/pre-trained-models/pre-filter_model.ckpt
  mode: sample
  seed: 0

data:
  top_folder: /path/to/lund_files
  max_particles: 53
  eta_clamp: [-3.0, 5.0]
  class_based_scaling: true
  datasets:
    - name: clasdis_lund
      path: "*.dat"
      n_events: 500_000
