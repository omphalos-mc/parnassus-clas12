name: FM_Impact_Test

trainer:
  callbacks:
    - class_path: parnassus_core.flow.callbacks.Checkpoint
      init_args:
        monitor: val/loss
        save_last: true
    - class_path: parnassus_core.flow.callbacks.ImpactPerformanceLogger
    - class_path: lightning.pytorch.callbacks.ModelSummary
      init_args:
        max_depth: 2
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50

data:
  train_type: particle
  fs_mask_type: charged

  num_train: 2_800_000
  num_valid: 35_000

  scale_dict: /srv01/agrp/dmitrykl/projects/parnassus-core/src/parnassus_core/experiments/cms_2011/configs/var_transform_atan.yaml
  var_dict: /srv01/agrp/dmitrykl/projects/parnassus-core/src/parnassus_core/experiments/cms_2011/configs/impact_vars.yaml

model:
  loss:
    class_path: parnassus_core.flow.utils.MSEAndDirectionLoss

  fm:
    class_path: parnassus_core.flow.utils.FlowMatcher
    init_args:
      sigma: 0.0
      flow_type: icfm

  sampler_type: euler
  n_steps: 25

  model:
    class_path: parnassus_core.flow.models.ImpactNetwork
    init_args:
      time_embedding:
        class_path: parnassus_core.flow.modules.TimestepEmbedder
        init_args:
          hidden_dim: &dim 96
          time_factor: 1000
      fourier_embedding:
        class_path: parnassus_core.flow.modules.FourierBase2Embedding
        init_args:
          start: 6

      fs_init_net:
        class_path: parnassus_core.flow.modules.DenseNetwork
        init_args:
          input_dim: 20
          hidden_dim: &dim2 192
          output_dim: 48
          act_h: &act SiLU
      ctxt_networks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: parnassus_core.flow.modules.NamedNetwork
              init_args:
                input_name: pf_ctxt
                fields: ["data"]
                dense_kwargs:
                  input_dim: 12
                  hidden_dim: *dim2
                  output_dim: 48
                  act_h: *act
            - class_path: parnassus_core.flow.modules.NamedNetwork
              init_args:
                input_name: ctxt
                fields: ["data"]
                dense_kwargs:
                  input_dim: 12
                  hidden_dim: *dim2
                  output_dim: *dim
                  act_h: *act
            - class_path: parnassus_core.flow.modules.NamedNetwork
              init_args:
                input_name: ctxt_global
                fields: ["data"]
                dense_kwargs:
                  input_dim: 14
                  hidden_dim: *dim2
                  output_dim: *dim
                  act_h: *act
      global_embedding:
        class_path: parnassus_core.flow.modules.GlobalContextEmbedding
        init_args:
          input_names: ["ctxt_global", "time"]
      encoder:
        class_path: parnassus_core.flow.modules.DiTEncoder
        init_args:
          hidden_dim: *dim
          num_heads: 6
          num_layers: 2
          ctxt_ratio: 2
          bidirectional: false
          attn_type: flex
          mha_config:
            qk_norm: true
            bias: false
      resnet:
        class_path: parnassus_core.flow.modules.DenseNetwork
        init_args:
          input_dim: *dim
          hidden_dim: *dim
          output_dim: *dim
          num_blocks: 3
          n_lyr_pbk: 3
          do_res: True
          do_out: False
          layer_scale: True
          pre_norm: LayerNorm
          act_h: *act
      fs_out_net:
        class_path: parnassus_core.flow.modules.DenseNetwork
        init_args:
          input_dim: *dim
          hidden_dim: *dim
          output_dim: 4
          act_h: *act
