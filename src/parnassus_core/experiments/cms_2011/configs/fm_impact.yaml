name: icfm_cms_pow_fevt_MSEDir_EMAMeanAtan_PFCross_Impact
model_type: impact_network
flow_type: icfm
sigma: 0.0
loss_type: mse_and_direction
sampler_type: euler
n_steps: 25

num_epochs: 100

opt: lion
optimizer_kwargs:
    weight_decay: 0.01
    lr: 1e-4

lr_scheduler: true
lr_scheduler_type: warmup_decay
lr_scheduler_dict:
    warmup_steps: 10_000
    decay_steps: 100_000
    min_lr: 1e-5

use_swa: false
use_ema: true
ema_decay: 0.999
check_val_every_n_epoch: 1
gradient_clip_val: 1.0

data:
  num_workers: 6

  train_batch_size: 128
  valid_batch_size: 2000

  max_particles: 400
  fs_mask_type: charged
  zero_neutral_vtx: true
  sin_cos: true

  num_train: 2_800_000
  num_valid: 35000

  entry_start_train: 0
  entry_start_valid: 2_800_000
  entry_start_test: 0

  train_path: /storage/agrp/dmitrykl/fastsim/f_delphes/data/full_event/output_impact/QCD_Pt-470to600_TTbar_Merged/merged_train_v2_pt025_eta27_ghost.root
  valid_path: /storage/agrp/dmitrykl/fastsim/f_delphes/data/full_event/output_impact/QCD_Pt-470to600_TTbar_Merged/merged_train_v2_pt025_eta27_ghost.root
  test_path: /storage/agrp/dmitrykl/fastsim/f_delphes/data/full_event/output_impact/QCD_Pt-600to800_TuneZ2_7TeV_pythia6/merged_test_small_v2_pt025_eta27_ghost.root

  scale_dict: /srv01/agrp/dmitrykl/projects/parnassus-core/src/experimentscms_2011/configs/var_transform_atan.yaml

  variables: !include impact_vars.yaml


model:
    ca_collection: pf_ctxt
    time_embedding:
        hidden_dim: &dim 96
        time_factor: 1000

    fourier:
        start: 6
    
    fs_init_net:
        input_dim: 20
        hidden_dim: &dim2 192
        output_dim: *dim
        act_h: &act SiLU

    ctxt_networks:
        - input_name: pf_ctxt
          fields: ['data']
          dense_kwargs:
            input_dim: 12
            hidden_dim: *dim2
            output_dim: *dim
            act_h: *act

        # - input_name: ctxt
        #   fields: ['data']
        #   dense_kwargs:
        #     input_dim: 12
        #     hidden_dim: *dim
        #     output_dim: *dim
        #     act_h: *act
        
        - input_name: ctxt_global
          fields: ['data']
          dense_kwargs:
            input_dim: 14
            hidden_dim: *dim2
            output_dim: *dim
            act_h: *act
    
    global_embedding:
        input_names: ['ctxt_global', 'time']

    transformer:
        num_layers: 2
        net_kwargs:
            hidden_dim: *dim
            num_heads: 6
            ctxt_ratio: 2
            mha_config:
                qk_norm: true
                bias: false
                attn_type: flex

    resnet:
        num_layers: 3
        net_kwargs:
            input_dim: *dim
            output_dim: *dim
            n_layers: 3
            do_res: True
            layer_scale: True
            pre_norm: LayerNorm
            act: *act

    fs_out_net:
        input_dim: *dim
        hidden_dim: *dim
        output_dim: 4
        act_h: *act