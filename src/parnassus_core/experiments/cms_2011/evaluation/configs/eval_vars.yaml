# New format: collection-agnostic (used by EagerDataset)
event_vars: ["eventNumber"]
vars_to_load:
  truth:
    - pt
    - eta
    - phi
    - vx
    - vy
    - vz
    - class

fs_vars:
  event:
    - pflow_ht
    - pflow_met_x
    - pflow_met_y
    - npflow
  particle:
    - pflow_ptrel
    - pflow_eta
    - pflow_phi
    - pflow_vx
    - pflow_vy
    - pflow_vz
    - pflow_class
  impact:
    - pflow_d0
    - pflow_d0Error
    - pflow_z0
    - pflow_z0Error

ctxt_vars:
  - truth_ptrel
  - truth_eta
  - truth_phi
  - truth_vx
  - truth_vy
  - truth_vz
  - truth_class

ctxt_global_vars:
  - means
  - truth_ht
  - truth_met_x
  - truth_met_y
  - ntruth
