name: cms2012_event_fm_MSE

trainer:
  max_epochs: 200
  gradient_clip_val: 1.0

  callbacks:
    - class_path: parnassus_core.flow.callbacks.Checkpoint
      init_args:
        monitor: val/loss
        save_last: true
    - class_path: parnassus_core.flow.callbacks.EventPerformanceLogger
    - class_path: lightning.pytorch.callbacks.ModelSummary
      init_args:
        max_depth: 2
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50
    - class_path: lightning.pytorch.callbacks.StochasticWeightAveraging
      init_args:
        swa_lrs: 3e-5
    - class_path: parnassus_core.flow.callbacks.PredictionWriter

data:
  train_type: event

  valid_batch_size: 5000

  scale_dict: /srv01/agrp/dmitrykl/projects/parnassus-core/src/parnassus_core/experiments/cms_2012/configs/var_transform.yaml
  var_dict: /srv01/agrp/dmitrykl/projects/parnassus-core/src/parnassus_core/experiments/cms_2012/configs/event_vars.yaml

  zero_neutral_vtx: false
  recalculate_ip: true

model:
  optimizer: Lion
  optimizer_kwargs:
    lr: 3e-5
    # weight_decay: 0.01

  lrs_config:
    skip_scheduler: false
    lr_scheduler_type: cosine
    lr_scheduler_kwargs:
      gamma: 0.8

  loss:
    class_path: parnassus_core.flow.utils.MSELoss

  fm:
    class_path: parnassus_core.flow.utils.FlowMatcher
    init_args:
      sigma: 0.0001
      flow_type: fm
      time_distribution: pow

  sampler_type: pndm
  n_steps: 25

  model:
    class_path: parnassus_core.flow.models.EventNetwork
    init_args:
      time_embedding:
        class_path: parnassus_core.flow.modules.TimestepEmbedder
        init_args:
          hidden_dim: &dim 128
          time_factor: 1000
      fs_init_net:
        class_path: parnassus_core.flow.modules.DenseNetwork
        init_args:
          input_dim: 4
          hidden_dim: &dim2 256
          output_dim: *dim
          act_h: &act GELU
      ctxt_networks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: parnassus_core.flow.modules.NamedNetwork
              init_args:
                input_name: ctxt
                fields: ["data"]
                dense_kwargs:
                  input_dim: 15
                  hidden_dim: *dim2
                  output_dim: *dim
                  act_h: *act
            - class_path: parnassus_core.flow.modules.NamedNetwork
              init_args:
                input_name: ctxt_global
                fields: ["data"]
                dense_kwargs:
                  input_dim: 12
                  hidden_dim: *dim2
                  output_dim: *dim
                  act_h: *act
      global_embedding:
        class_path: parnassus_core.flow.modules.GlobalContextEmbedding
        init_args:
          input_names: ["ctxt", "ctxt_global", "time"]
      encoder:
        class_path: parnassus_core.flow.modules.DenseNetwork
        init_args:
          input_dim: *dim
          hidden_dim: *dim
          output_dim: *dim
          num_blocks: 3
          n_lyr_pbk: 3
          do_res: True
          do_out: False
          layer_scale: True
          pre_norm: LayerNorm
          skip_last_act: True
      fs_out_net:
        class_path: parnassus_core.flow.modules.DenseNetwork
        init_args:
          input_dim: *dim
          hidden_dim: *dim
          output_dim: 4
          ctxt_dim: 384
          act_h: *act
