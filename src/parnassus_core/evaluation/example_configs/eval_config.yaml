eval_path: /path/to/eval_output

recalculate_ip: False
# Path to scale dict used in the model trainings
scale_dict: /path/to/scale_dict
# Path to variable dict specifying which variables to load and evaluate
var_dict: /path/to/eval_vars.yaml

event_model:
  ckpt_path: "/path/to/event_model.ckpt"
  sampler_type: "euler"
  n_steps: 50

particle_model:
  ckpt_path: "/path/to/particle_model.ckpt"
  sampler_type: "dpm"
  n_steps: 40

# Optional: keep only events whose scattered electron the classifier deems
# reconstructed, applied while each dataset is read. n_events then counts kept
# events. Leave it out for input that is already filtered.
# scatE_filter:
#   ckpt_path: "/path/to/pre-filter_model.ckpt"
#   mode: sample # or threshold
#   seed: 0

data:
  top_folder: /path/to/data/
  datasets:
    - name: dataset1
      path: dataset1.root # Path relative to top_folder
      n_events: 100_000 # Number of events to evaluate
    - name: generator_sample
      path: lund/*.dat # LUND input: a .dat/.lund file, a directory, or a glob
      n_events: 100_000
