# Variables for a full-chain evaluation (event model -> particle model).
#
# fs_vars.event must match the targets of the event model's training config, and
# fs_vars.particle and ctxt_vars must match the particle model's, exactly and in
# order: EvaluationModel._get_fs_var_idxs walks these lists to compute feature
# offsets into the generated tensor.
#
# Only the truth collection is read from the input: in eval mode every pflow
# variable comes from the models.
event_vars: ["eventNumber"]
vars_to_load:
  truth:
    - p
    - theta
    - phi
    - vx
    - vy
    - vz
    - pdgId

fs_vars:
  event:
    - npflow
    - pflow_ht_p
    - pflow_Pxh
    - pflow_Pyh
  particle:
    - pflow_p
    - pflow_theta
    - pflow_phi
    - pflow_vx
    - pflow_vy
    - pflow_vz
    - pflow_pdgId

ctxt_vars:
  - truth_p
  - truth_theta
  - truth_phi
  - truth_vx
  - truth_vy
  - truth_vz
  - truth_pdgId

ctxt_global_vars:
  - means
  - ntruth
  - truth_ht_p
  - truth_Pxh
  - truth_Pyh
